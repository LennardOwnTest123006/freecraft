# FreeCraft Standardeinstellungen (Shader-Paket)
default_game = freecraft
video_driver = opengl
vsync = true
fps_max = 144
viewing_range = 160
enable_shaders = true
enable_dynamic_shadows = true
shadow_strength_gamma = 0.85
shadow_map_max_distance = 140
shadow_map_texture_size = 2048
shadow_map_color = true
enable_bloom = true
bloom_intensity = 0.08
enable_volumetric_lighting = true
enable_auto_exposure = true
enable_waving_leaves = true
enable_waving_plants = true
enable_waving_water = true
smooth_lighting = true
enable_particles = true
enable_clouds = true
mip_map = true
anisotropic_filter = true
antialiasing = fsaa
fsaa = 4
creative_mode = false
enable_damage = true
server_announce = false

# Shader-Feintuning (schöner)
enable_post_processing = true
enable_waving_water = true
water_wave_height = 0.06
water_wave_length = 18
water_wave_speed = 4
shadow_soft_radius = 8
shadow_filters = 2
shadow_update_frames = 8
shadow_map_texture_32bit = true
shadow_map_texture_floating_point = true
enable_translucent_foliage = true
enable_water_reflections = true
enable_debanding = true
bloom_strength_factor = 1.0
bloom_radius = 2.0
exposure_compensation = 0.15
tone_mapping = true
fog_start = 0.6

# Mehr Mobs
mobs_spawn = true
mcl_mob_cap_animal = 25
mcl_mob_cap_monster = 90
mcl_mob_cap_ambient = 25
mcl_mob_cap_water = 15
mcl_mob_cap_player = 110

# Realistischer: weitere Sicht, feinere Filter
viewing_range = 200
texture_clean_transparent = true
enable_minimap = true

# Wasser, PvP, Schwimmen
opaque_water = false
enable_pvp = true
enable_damage = true

# === Performance v2 (schneller & flüssiger; spätere Werte überschreiben frühere) ===
video_driver = opengl3
fsaa = 2
viewing_range = 120
client_mesh_chunk = 4
mesh_generation_threads = 0
enable_vbo = true
shadow_map_texture_size = 2048
shadow_map_texture_32bit = false
shadow_map_texture_floating_point = false
shadow_filters = 2
shadow_soft_radius = 7
shadow_update_frames = 16
shadow_map_max_distance = 120
enable_volumetric_lighting = true
enable_auto_exposure = true
enable_debanding = false
max_block_send_distance = 10
server_map_save_interval = 15
ipv6_server = false
secure.http_mods = freecraft_extras

# === FreeCraft 1.0 Feinschliff ===
chat_log_level = none
freecraft_music_volume = 0.5
# Nacht etwas heller
lighting_alpha = 0.25
lighting_boost = 0.28
update_information_url =
